[package]
name = "ocu-mobile"
description = "Phones, tablets, iOS simulators and Android emulators: Android over adb, iOS through WebDriverAgent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ocu-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
png.workspace = true
log.workspace = true
# WebDriverAgent's HTTP API, and fetching its prebuilt runner.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# uiautomator's XML dumps.
quick-xml = "0.41"
# Telling whether a device already has this copy of the helper.
sha2 = "0.10"
