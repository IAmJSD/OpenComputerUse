[package]
name = "ocu-linux"
description = "The Linux backend: each session gets its own display, an Xvfb driven through XTEST or a headless Wayland compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# The tree's types, which the AT-SPI mapping builds anywhere.
ocu-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
anyhow.workspace = true
log.workspace = true
libc.workspace = true
x11rb = { version = "0.13", features = ["xtest"] }
# The headless Wayland compositor: only the server half and the software
# (pixman) renderer, so no GPU, DRM, libinput or seat library is needed.
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "desktop", "renderer_pixman"] }
# AT-SPI: the accessibility registry on a session's private bus, and walks
# of the app's tree over it.
zbus.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde.workspace = true

# Screen sessions on an X display of their own; skips itself without Xvfb.
[[test]]
name = "screen"
harness = false
