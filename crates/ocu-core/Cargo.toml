[package]
name = "ocu-core"
description = "The platform-neutral half of opencomputeruse: the backend traits, the session registry and the wire types"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
png.workspace = true
log.workspace = true
tungstenite.workspace = true

# The file chooser portal, which only a Unix app asks on.
[target.'cfg(unix)'.dependencies]
zbus.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros"] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros"] }
