name: Test
on: push

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting is the same on every platform, so one runner is enough.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Each backend only compiles on its own platform, so clippy runs once per
  # platform to lint all of them. Warnings are errors here.
  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The tests, on each platform. The file chooser portal's tests want a
  # dbus-daemon to start a private bus with; without one they skip, so it is
  # installed where it is not already there.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dbus-daemon (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus
      - name: Install dbus-daemon (macOS)
        if: runner.os == 'macOS'
        run: brew install dbus
      - run: cargo test --workspace
