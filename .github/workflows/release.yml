name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both halves of the universal binary.
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml's version $version." >&2
            exit 1
          fi

      - name: Set up the signing keychain
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -eo pipefail
          if [ -z "${MACOS_CERT_P12_BASE64}" ]; then
            echo "No MACOS_CERT_P12_BASE64 secret; this build will be signed ad hoc."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/developer_id_application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          # The keychain goes with the runner, so its password only has to be
          # unguessable for the length of this job.
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(openssl rand -base64 24)}"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERT_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          # Prepend rather than replace: notarytool still wants the login
          # keychain on the search list.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$IDENTITY" ]; then
            echo "The certificate imported but holds no Developer ID Application identity." >&2
            exit 1
          fi
          echo "MACOS_CERT_NAME=$IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ./scripts/bundle-macos.sh
          # Upload the zip and image alone: upload-artifact does not keep the
          # bundle's permissions or symlinks, which would void the signature.
          rm -rf dist/OpenComputerUse.app

      - uses: actions/upload-artifact@v5
        with:
          name: opencomputeruse-macos
          path: dist/*

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          cargo build --release
          mkdir -p dist
          # Arch-suffixed: both Linux jobs publish into one release.
          cp target/release/opencomputeruse "dist/opencomputeruse-linux-$(uname -m)"
          strip --strip-unneeded "dist/opencomputeruse-linux-$(uname -m)"
      - uses: actions/upload-artifact@v5
        with:
          name: opencomputeruse-linux-${{ matrix.os }}
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build the panel hook
        shell: pwsh
        # The hook runs inside other apps, so it links the C runtime
        # statically (/MT) and may import only Windows system DLLs.
        run: |
          New-Item -ItemType Directory -Force -Path target\panelhook | Out-Null
          cl /nologo /W4 /WX /O2 /LD /std:c11 /DUNICODE /D_UNICODE `
            /D_WIN32_WINNT=0x0601 /MT `
            /Fe:target\panelhook\OcuPanelHook.dll `
            packaging\windows\panelhook\hook.c `
            /link ole32.lib shell32.lib shlwapi.lib uuid.lib comdlg32.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Dependents are the indented lines; "Dump of file" is not.
          $imports = dumpbin /nologo /dependents target\panelhook\OcuPanelHook.dll |
            Select-String -Pattern '^\s+(\S+\.dll)\s*$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          $allowed = @('kernel32.dll', 'ole32.dll', 'shell32.dll', 'shlwapi.dll', 'comdlg32.dll')
          $stray = $imports | Where-Object { $allowed -notcontains $_.ToLower() }
          if ($stray) {
            Write-Error "the hook imports $($stray -join ', '), which are not allowed"
            exit 1
          }
          Write-Host "hook imports: $($imports -join ', ')"
      - name: Sign the panel hook
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PFX_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            Write-Host "No WINDOWS_CERT_PFX_BASE64 secret; the hook is unsigned."
            exit 0
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\release.pfx",
            [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          # Timestamped, so it still validates after the certificate expires.
          signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            /f "$env:RUNNER_TEMP\release.pfx" /p $env:WINDOWS_CERT_PFX_PASSWORD `
            target\panelhook\OcuPanelHook.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item "$env:RUNNER_TEMP\release.pfx" -Force
      - name: Build
        shell: pwsh
        run: |
          # Embeds the signed hook in the exe (crates/ocu-windows/build.rs).
          $env:OCU_PANEL_HOOK_DLL = "$PWD\target\panelhook\OcuPanelHook.dll"
          cargo build --release
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/opencomputeruse.exe dist/opencomputeruse-windows-x86_64.exe
      - uses: actions/upload-artifact@v5
        with:
          name: opencomputeruse-windows-x86_64
          path: dist/*

  android:
    # The Android helper (and on-device app): the desktop fetches the APK of
    # its own version from the release to give phone sessions a display.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OCU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OCU_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eo pipefail
          # One signing key across releases, so the app updates in place;
          # without the secret the build gets a throwaway key.
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            export OCU_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          android/build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: opencomputeruse-android
          path: dist/OpenComputerUse.apk

  publish:
    needs: [macos, linux, windows, android]
    # The macOS app is what the updater needs; a failed Linux or Windows
    # build leaves its binary out of the release rather than holding it up.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
