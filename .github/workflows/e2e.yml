name: End to end
on: push

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A real app opens real file dialogs and choose_file answers them
  # (tests/file_dialogs.rs), with each platform's hook and without it.
  file-dialogs:
    name: file dialogs (${{ matrix.os }}, hook ${{ matrix.hook }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        hook: [on, off]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # The Windows panel hook loads into the app but does not yet answer its
    # dialogs (hook.c, never run on a real machine). The hook is opt-in and
    # off by default, so this one combination does not block CI; it still
    # runs and reports, to show the day the hook works.
    continue-on-error: ${{ matrix.os == 'windows-latest' && matrix.hook == 'on' }}
    env:
      OCU_E2E_HOOK: ${{ matrix.hook == 'on' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Set up (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "OCU_E2E_APP=$(tests/e2e/macos/build.sh "$RUNNER_TEMP")" >> "$GITHUB_ENV"
          if [ "$OCU_E2E_HOOK" = 1 ]; then
            OCU_SIGN_ID=- packaging/macos/panelhook/build.sh
            echo "OCU_PANEL_HOOK=$PWD/dist/OcuPanelHook.dylib" >> "$GITHUB_ENV"
            # The hook is only offered with App Management, which the runner
            # image does not grant. Give it to whatever has Accessibility
            # there: those rows live in the system database, App Management
            # is looked up in both.
            sys="/Library/Application Support/com.apple.TCC/TCC.db"
            user="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
            for db in "$sys" "$user"; do
              from=access
              attach=
              if [ "$db" = "$user" ]; then
                from=sys.access
                attach="ATTACH '$sys' AS sys;"
              fi
              sudo sqlite3 "$db" "$attach
                CREATE TEMP TABLE t AS
                  SELECT * FROM $from WHERE service = 'kTCCServiceAccessibility';
                UPDATE t SET service = 'kTCCServiceSystemPolicyAppBundles';
                INSERT OR REPLACE INTO main.access SELECT * FROM t;"
              echo "App Management in $db:"
              sudo sqlite3 "$db" "SELECT client, auth_value FROM access
                WHERE service = 'kTCCServiceSystemPolicyAppBundles'"
            done
            # tccd caches the database; restart it so the grant is seen.
            sudo killall tccd || true
            killall tccd || true
          fi

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Set up (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = "$env:RUNNER_TEMP\dialog.exe"
          cl /nologo /W4 /WX tests\e2e\windows\dialog.c "/Fe:$app" "/Fo:$env:RUNNER_TEMP\" `
            /link ole32.lib shell32.lib uuid.lib comdlg32.lib user32.lib /SUBSYSTEM:WINDOWS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OCU_E2E_APP=$app" >> $env:GITHUB_ENV
          if ($env:OCU_E2E_HOOK -eq '1') {
            $dll = "$env:RUNNER_TEMP\panelhook\OcuPanelHook.dll"
            packaging\windows\panelhook\build.ps1 -Out $dll
            "OCU_PANEL_HOOK=$dll" >> $env:GITHUB_ENV
            # The hook logs each step it reaches here, to bring it up.
            "OCU_PANEL_LOG=$env:RUNNER_TEMP\panelhook.log" >> $env:GITHUB_ENV
          }

      - name: Set up (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus python3-gi gir1.2-gtk-3.0 \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev
          echo "OCU_E2E_APP=$PWD/tests/e2e/linux/dialog.py" >> "$GITHUB_ENV"

      - name: Run
        run: cargo test --test file_dialogs

      - name: The panel hook's log
        if: always() && runner.os == 'Windows' && env.OCU_E2E_HOOK == '1'
        shell: pwsh
        run: Get-Content "$env:RUNNER_TEMP\panelhook.log" -ErrorAction SilentlyContinue
