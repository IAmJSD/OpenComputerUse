name: End to end
on: push

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A real app opens real file dialogs and choose_file answers them
  # (tests/file_dialogs.rs), with each platform's hook and without it.
  file-dialogs:
    name: file dialogs (${{ matrix.os }}, hook ${{ matrix.hook }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        hook: [on, off]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      OCU_E2E_HOOK: ${{ matrix.hook == 'on' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Set up (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "OCU_E2E_APP=$(tests/e2e/macos/build.sh "$RUNNER_TEMP")" >> "$GITHUB_ENV"
          if [ "$OCU_E2E_HOOK" = 1 ]; then
            OCU_SIGN_ID=- packaging/macos/panelhook/build.sh
            echo "OCU_PANEL_HOOK=$PWD/dist/OcuPanelHook.dylib" >> "$GITHUB_ENV"
            # The hook is only offered with App Management, which the runner
            # image does not grant. Give it to whatever has Accessibility
            # there: those rows live in the system database, App Management
            # is looked up in both.
            sys="/Library/Application Support/com.apple.TCC/TCC.db"
            user="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
            for db in "$sys" "$user"; do
              from=access
              attach=
              if [ "$db" = "$user" ]; then
                from=sys.access
                attach="ATTACH '$sys' AS sys;"
              fi
              sudo sqlite3 "$db" "$attach
                CREATE TEMP TABLE t AS
                  SELECT * FROM $from WHERE service = 'kTCCServiceAccessibility';
                UPDATE t SET service = 'kTCCServiceSystemPolicyAppBundles';
                INSERT OR REPLACE INTO main.access SELECT * FROM t;"
              echo "App Management in $db:"
              sudo sqlite3 "$db" "SELECT client, auth_value FROM access
                WHERE service = 'kTCCServiceSystemPolicyAppBundles'"
            done
            # tccd caches the database; restart it so the grant is seen.
            sudo killall tccd || true
            killall tccd || true
          fi

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Set up (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = "$env:RUNNER_TEMP\dialog.exe"
          cl /nologo /W4 /WX tests\e2e\windows\dialog.c "/Fe:$app" "/Fo:$env:RUNNER_TEMP\" `
            /link ole32.lib shell32.lib uuid.lib comdlg32.lib user32.lib /SUBSYSTEM:WINDOWS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OCU_E2E_APP=$app" >> $env:GITHUB_ENV
          if ($env:OCU_E2E_HOOK -eq '1') {
            $dll = "$env:RUNNER_TEMP\panelhook\OcuPanelHook.dll"
            packaging\windows\panelhook\build.ps1 -Out $dll
            "OCU_PANEL_HOOK=$dll" >> $env:GITHUB_ENV
          }

      - name: Set up (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus python3-gi gir1.2-gtk-3.0 \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev libpixman-1-dev
          echo "OCU_E2E_APP=$PWD/tests/e2e/linux/dialog.py" >> "$GITHUB_ENV"

      - name: Run
        run: cargo test --test file_dialogs

  # Chrome on a headless Wayland session: the agent's tools, the live view
  # and the sessions API (scripts/linux/wayland_smoke.py), then the X11
  # smoke test beside it. Both then read Chrome's and GTK's accessibility
  # trees over AT-SPI (scripts/linux/a11y_checks.py).
  linux-wayland:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OCU_SMOKE_BROWSER: google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set up
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-apps foot python3-websocket xkb-data fonts-dejavu-core \
            dbus python3-gi gir1.2-gtk-3.0 gir1.2-gtk-4.0 \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev libpixman-1-dev
      - run: cargo build --bin opencomputeruse
      - name: Wayland
        run: python3 scripts/linux/wayland_smoke.py target/debug/opencomputeruse
      - name: X11
        run: python3 scripts/linux/smoke.py target/debug/opencomputeruse

  # A real app shows an invoice, and `opencomputeruse extract` reads its
  # values with Cloudflare's Clairic from the window's accessibility tree and
  # screenshot (tests/extract.rs). Needs the CLOUDFLARE_ACCOUNT_ID and
  # CLOUDFLARE_API_TOKEN secrets (a token with Workers AI access); without
  # them it says so and passes.
  extract:
    name: extract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::extract tests skipped: add the CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN secrets to run them"
          fi

      - uses: actions/checkout@v5
        if: steps.creds.outputs.present
      - uses: dtolnay/rust-toolchain@stable
        if: steps.creds.outputs.present
      - uses: Swatinem/rust-cache@v2
        if: steps.creds.outputs.present

      - name: Set up (macOS)
        if: steps.creds.outputs.present && runner.os == 'macOS'
        run: |
          echo "OCU_E2E_INVOICE_APP=$(tests/e2e/macos/build.sh "$RUNNER_TEMP" Invoice)" >> "$GITHUB_ENV"
          # Screenshots need Screen Recording, which the runner image may
          # not grant: give it to whatever has Accessibility there, as the
          # file dialog job does for App Management.
          db="/Library/Application Support/com.apple.TCC/TCC.db"
          sudo sqlite3 "$db" "
            CREATE TEMP TABLE t AS
              SELECT * FROM access WHERE service = 'kTCCServiceAccessibility';
            UPDATE t SET service = 'kTCCServiceScreenCapture';
            INSERT OR REPLACE INTO main.access SELECT * FROM t;"
          sudo killall tccd || true
          killall tccd || true

      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.creds.outputs.present && runner.os == 'Windows'
      - name: Set up (Windows)
        if: steps.creds.outputs.present && runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = "$env:RUNNER_TEMP\invoice.exe"
          cl /nologo /W4 /WX tests\e2e\windows\invoice.c "/Fe:$app" "/Fo:$env:RUNNER_TEMP\" `
            /link user32.lib gdi32.lib /SUBSYSTEM:WINDOWS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OCU_E2E_INVOICE_APP=$app" >> $env:GITHUB_ENV

      - name: Set up (Linux)
        if: steps.creds.outputs.present && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus at-spi2-core python3-gi gir1.2-gtk-3.0 \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev libpixman-1-dev
          echo "OCU_E2E_INVOICE_APP=$PWD/tests/e2e/linux/invoice.py" >> "$GITHUB_ENV"

      - name: Run
        if: steps.creds.outputs.present
        run: cargo test --test extract -- --nocapture
