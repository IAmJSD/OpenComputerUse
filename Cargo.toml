[workspace]
resolver = "2"
members = ["crates/ocu-core", "crates/ocu-macos", "crates/ocu-linux", "crates/ocu-windows", "crates/ocu-mobile"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
authors = ["Astrid Gealer"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.17"
libc = "0.2"
log = "0.4"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
ocu-core = { path = "crates/ocu-core" }

[package]
name = "opencomputeruse"
description = "Background computer use for agents, as an MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "opencomputeruse"
path = "src/main.rs"

[dependencies]
ocu-core.workspace = true
# Phones, tablets, iOS simulators and Android emulators.
ocu-mobile = { path = "crates/ocu-mobile" }
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
base64.workspace = true
png.workspace = true
# Checking a self-update download against the digest its release lists.
sha2 = "0.10"
# The optional HTTP server for other devices, and the keys it checks.
tiny_http = "0.12"
getrandom = "0.3"
log.workspace = true
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
# The recipe runner's OpenAI-compatible driver.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# The network adapters the HTTP server can be limited to.
if-addrs = "0.15"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ocu-macos = { path = "crates/ocu-macos" }
# The agent app's UI: the status window and the cursor overlay.
gpui = { git = "https://github.com/IAmJSD/gpui", rev = "45a4fb3b7fa2a155368f34de09bfae59deda84ef" }
async-channel = "2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication", "NSWindow", "NSView", "NSResponder", "NSGraphics", "NSWorkspace", "NSScreen"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSArray"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
ocu-linux = { path = "crates/ocu-linux" }

[target.'cfg(windows)'.dependencies]
ocu-windows = { path = "crates/ocu-windows" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4

# gpui's vendored crates, restated from the fork (Cargo only honours
# `[patch]` in the top-level manifest).
[patch.crates-io]
gpui_util = { git = "https://github.com/IAmJSD/gpui", rev = "45a4fb3b7fa2a155368f34de09bfae59deda84ef" }
gpui_http_client = { git = "https://github.com/IAmJSD/gpui", rev = "45a4fb3b7fa2a155368f34de09bfae59deda84ef" }
blade-graphics = { git = "https://github.com/IAmJSD/gpui", rev = "45a4fb3b7fa2a155368f34de09bfae59deda84ef" }
